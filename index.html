
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>وب سایت من</title>
< link rel = "stylesheet"   href="first.css" >
    <style>
        body {
            font-family: Tahoma;
            background-color: #f0f0f0;
            text-align: center;
            margin: 0;
        }

        header {
            background-color: #1565c0;
            color: white;
            padding: 25px;
        }

        .content {
            background: white;
            margin: 50px auto;

        button {
            background: #1565c0;
            color: white;
            padding: 12px 25px;

        }

        button:hover {
            background: #0d47a1;
        }

<body>

    <header>
        <h1>به وب سایت من خوش آمدید</h1>
        <p>اولین پروژه طراحی وب من</p>
    </header>

    <div class="content">
        <h2>درباره من</h2>
        <p>سلام! من در حال یادگیری برنامه نویسی وب هستم.</p>

        <button onclick="alert('سلام! خوش آمدید')">
            کلیک کنید
        </button>
    </div>

</body>
</html>
